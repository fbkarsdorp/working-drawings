<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Working Drawings · reel</title>
<link rel="stylesheet" href="../css/geist.css">
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../js/opentype.min.js"></script>
<script src="../js/font-geist-black.js"></script>
<script src="../js/content.js"></script>
<script src="../js/mesh.js"></script>
<script src="../js/objects.js"></script>
<script src="../js/ink.js"></script>
<script src="../js/type.js"></script>
<script>
/* Working Drawings · a 20-second reel, drawn with the deck's own pencil engine.
 *
 * The whole reel is one working drawing: a large sheet on the drafting table with the eleven apps
 * taped on as prints, each with its pencil drawing, its name hatched in, and its build time as an
 * architectural dimension. A camera flies over the sheet; it opens and closes on the sheet's
 * title block. Every frame is a pure function of t: renderFrame(t) renders several sub-frames
 * when the camera moves fast and averages them (motion blur). render.py renders all 600 frames,
 * synthesises the sound from window.EVENTS and muxes the result. index.html?play previews live.
 *
 * 120 bpm, a beat is 0.5 s. 0–2 s title block · 2.0 drop: the eleven apps, arriving on the beat
 * (a burst of hard cuts at 10–11.6 s) · 15 s the camera pulls back to the whole sheet while the
 * route is drawn · 17.1 s it dives into the title block · 18.0 s the stamp. */
"use strict";
const W = 1920, H = 1080, FPS = 30, DUR = 20, DEG = Math.PI / 180;
const D = window.DECK, tr = (o) => (o && o.en !== undefined ? o.en : o);
const RED = "#C8223F", INK = "#16161A", PAPER = "#EDE6D5", CARD = "#f8f4ea";
const mk = (w = W, h = H) => { const k = document.createElement("canvas"); k.width = w; k.height = h; return k; };
const c = document.getElementById("c"), ctx = c.getContext("2d");
const ic = mk(), ictx = ic.getContext("2d");      // the pencil layer
const acc = mk(), actx = acc.getContext("2d");    // motion-blur accumulator
ctx.imageSmoothingQuality = "high";
Ink.makeBackgrounds({ W, H, dpr: 1, scale: 1, ox: 0, oy: 0 });
Type.init();

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (u) => 1 - Math.pow(1 - u, 3);
const inOutCubic = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const inOutQuart = (u) => (u < 0.5 ? 8 * u ** 4 : 1 - Math.pow(-2 * u + 2, 4) / 2);
const outExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const inOutExpo = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2);
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- the sheet ----------
const CW = 1760, CH = 990, GX = 220, GY = 220, MX = 300, MY = 300;           // a cell is one 16:9 view
const SW = MX * 2 + 4 * CW + 3 * GX, SH = MY * 2 + 3 * CH + 2 * GY;         // 8300 x 4010
const S0 = (W / CW) * 0.93;                                                  // a cell, with a margin
const BY = {}; D.apps.forEach((a) => (BY[a.id] = a));
// visit order (the deck's order), grid position (a snake), arrival and departure on the beat
const ST = [
  { id: "museum", r: 0, c: 0, a: 2.0, l: 3.1, v: [0, 0, 1.0, -0.8] },
  { id: "liederenbank", r: 0, c: 1, a: 3.5, l: 4.6, v: [20, 0, 1.03, 0.8] },
  { id: "dwaallicht", r: 0, c: 2, a: 5.0, l: 6.1, v: [-10, 0, 1.0, -0.7] },
  { id: "pland", r: 0, c: 3, a: 6.5, l: 7.1, v: [0, 0, 1.04, 0.9] },
  { id: "spindle", r: 1, c: 3, a: 7.5, l: 8.6, v: [-20, 0, 1.02, -0.9] },
  { id: "water", r: 1, c: 2, a: 9.0, l: 9.6, v: [10, 0, 1.04, 0.6] },
  { id: "rrh", r: 1, c: 1, a: 10.0, l: 10.5, v: [0, 0, 1.05, -1.0], cutOut: true },
  { id: "sagenland", r: 1, c: 0, a: 10.5, l: 11.0, v: [0, 0, 1.05, 0.9], cutIn: true, cutOut: true },
  { id: "nachtdienst", r: 2, c: 0, a: 11.0, l: 11.6, v: [0, 0, 1.04, -0.8], cutIn: true },
  { id: "atlas", r: 2, c: 1, a: 12.0, l: 12.6, v: [0, 0, 1.02, 0.9] },
  { id: "vraag", r: 2, c: 2, a: 13.0, l: 15.0, v: [0, 0, 1.0, -0.5] },
];
const CUTS = [10.5, 11.0];
function cellOrigin(r, col, jitter = true) {
  const k = r * 4 + col;
  return { x: MX + col * (CW + GX) + (jitter ? (hash(k + 11) - 0.5) * 80 : 0), y: MY + r * (CH + GY) + (jitter ? (hash(k + 29) - 0.5) * 60 : 0) };
}
const TBO = cellOrigin(2, 3, false);                                         // the title block
const PR = { x: 100, y: 180, w: 960, h: 600 };                               // the print, in a cell
ST.forEach((s, i) => {
  s.i = i; s.app = BY[s.id]; s.o = cellOrigin(s.r, s.c);
  s.sp = s.cutIn || s.cutOut ? 1.8 : 1;                                      // annotation speed
  s.rot = (hash(i + 3) - 0.5) * 2.4 * DEG;                                   // the print sits a little askew
  s.name = tr(s.app.big).join(" ");
  s.nameSize = Math.min(112, Type.fit([s.name], 1560, 112));
  s.kind = (s.app.kind ? tr(s.app.kind) : "The spark").toUpperCase();
  s.fact = s.app.facts[0];
});

// ---------- media: screenshots, and the recorded demos as frames (extracted by render.py) ----------
const VIDEOS = { museum: 9.0, liederenbank: 20.5, dwaallicht: 16.0, vraag: 12.5 }, VSPEED = 1.25, VFRAMES = 120;
const img = {}, vcache = new Map(), vcur = {};
const load = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
function vframe(id, k) {
  k = Math.max(1, Math.min(VFRAMES, k));
  const key = id + ":" + k;
  if (!vcache.has(key)) vcache.set(key, load(`.frames/${id}/${String(k).padStart(3, "0")}.jpg`));
  return vcache.get(key);
}
async function prepare(t) {
  await Promise.all(ST.filter((s) => s.id in VIDEOS).map(async (s) => {
    const im = await vframe(s.id, 1 + Math.floor(Math.max(0, t - (s.a - 0.25)) * VSPEED * FPS));
    vcur[s.id] = im || img[s.id];
  }));
}

// ---------- textures ----------
function paperTextures() {
  const g = mk(), x = g.getContext("2d"), id = x.createImageData(W, H), d = id.data;
  for (let i = 0; i < W * H; i++) {
    const r = Math.random(), v = 255 - Math.pow(r, 6) * 40 - Math.random() * 6;
    d[i * 4] = v; d[i * 4 + 1] = v * 0.996; d[i * 4 + 2] = v * 0.986; d[i * 4 + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  x.lineCap = "round";
  for (let i = 0; i < 420; i++) {
    const px = Math.random() * W, py = Math.random() * H, a = Math.random() * 6.28, L = 6 + Math.random() * 22;
    x.strokeStyle = Math.random() < 0.6 ? "rgba(120,100,70,0.08)" : "rgba(255,255,255,0.3)"; x.lineWidth = 0.6;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + 0.5) * L / 2, py + Math.sin(a + 0.5) * L / 2, px + Math.cos(a) * L, py + Math.sin(a) * L); x.stroke();
  }
  const tone = mk(), tx = tone.getContext("2d"), tg = tx.createRadialGradient(W * 0.45, H * 0.4, 0, W / 2, H / 2, W * 0.75);
  tg.addColorStop(0, "rgba(255,252,240,0.38)"); tg.addColorStop(1, "rgba(175,155,115,0.14)");
  tx.fillStyle = tg; tx.fillRect(0, 0, W, H);
  const vig = mk(), vx = vig.getContext("2d"), vg = vx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.68);
  vg.addColorStop(0, "rgba(40,28,16,0)"); vg.addColorStop(1, "rgba(40,28,16,0.24)");
  vx.fillStyle = vg; vx.fillRect(0, 0, W, H);
  return { grain: g, tone, vig };
}
// the rubber stamp: red Geist Black in a border, with ink texture knocked out
const STAMP = { text: "A NEW INTERFACE", size: 100, pad: 28, k: 2 };
function makeStamp() {
  const { text, size, pad, k } = STAMP, m = mk(8, 8).getContext("2d");
  m.font = `900 ${size}px Geist`; m.letterSpacing = "1px";
  const tw = m.measureText(text).width, cap = size * 0.72, bw = tw + 2 * pad, bh = cap + 2 * pad;
  const cv = mk(Math.ceil((bw + 12) * k), Math.ceil((bh + 12) * k)), x = cv.getContext("2d");
  x.scale(k, k); x.fillStyle = RED; x.strokeStyle = RED;
  x.font = `900 ${size}px Geist`; x.letterSpacing = "1px"; x.fillText(text, 6 + pad, 6 + pad + cap);
  x.lineWidth = 7; x.strokeRect(6 + 3.5, 6 + 3.5, bw - 7, bh - 7);
  x.globalCompositeOperation = "destination-out";
  let r = 99; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  for (let i = 0; i < 5200; i++) { x.globalAlpha = 0.25 + rnd() * 0.75; x.beginPath(); x.arc(rnd() * (bw + 12), rnd() * (bh + 12), rnd() < 0.92 ? rnd() * 1.1 : 1 + rnd() * 2.6, 0, 6.29); x.fill(); }
  x.lineWidth = 0.8;
  for (let i = 0; i < 70; i++) { x.globalAlpha = 0.18 + rnd() * 0.3; const yy = rnd() * (bh + 12), xx = rnd() * (bw + 12); x.beginPath(); x.moveTo(xx, yy); x.lineTo(xx + 20 + rnd() * 90, yy + (rnd() - 0.5) * 3); x.stroke(); }
  return { cv, bw: bw + 12, bh: bh + 12, cap };
}
let TX = null, STAMPCV = null;

// ---------- the camera ----------
function stationView(i, t) {
  const s = ST[i], [dx, dy, sm, rot] = s.v, u = inOutCubic(seg(t, s.a, s.l));
  let cx = s.o.x + CW / 2 + dx, cy = s.o.y + CH / 2 + dy;
  if (s.id === "vraag") { cx -= 110 * u; cy -= 10 * u; } else cx += 18 * u * (i % 2 ? 1 : -1);
  const dolly = s.id === "vraag" ? 0.07 : s.sp > 1 ? 0.05 : 0.03;
  const punch = t >= s.a ? Math.exp(-(t - s.a) * 10) * (i === 0 ? 0.05 : 0.025) : 0;   // a kick on the beat
  return { cx, cy, s: S0 * sm * (1 + dolly * u) * (1 + punch), rot: rot * DEG };
}
// a whip between stations: pull back, swing (banking into the move), push in
function moveView(A, B, u) {
  const e = inOutQuart(u), dist = Math.hypot(B.cx - A.cx, B.cy - A.cy), dip = clamp(dist / 9000, 0.14, 0.62);
  const ls = lerp(Math.log(A.s), Math.log(B.s), e) + Math.log(1 - dip * Math.sin(Math.PI * u));
  const bank = Math.sign(B.cx - A.cx || 1) * 2.2 * DEG * Math.sin(Math.PI * u);
  return { cx: lerp(A.cx, B.cx, e), cy: lerp(A.cy, B.cy, e), s: Math.exp(ls), rot: lerp(A.rot, B.rot, e) + bank };
}
// a zoom that keeps B's centre moving in a straight line to the middle of the frame
function zoomView(A, B, e) {
  const s = Math.exp(lerp(Math.log(A.s), Math.log(B.s), e)), k = (1 - e) * A.s / s;
  return { cx: B.cx - (B.cx - A.cx) * k, cy: B.cy - (B.cy - A.cy) * k, s, rot: lerp(A.rot, B.rot, e) };
}
function openView(t) {
  const u = outExpo(seg(t, 0, 0.9));
  return { cx: TBO.x + lerp(560, 700, u), cy: TBO.y + lerp(240, 290, u), s: lerp(1.95, 1.36, u) * (1 + 0.03 * seg(t, 0.9, 1.5)), rot: lerp(-5, -2, u) * DEG };
}
const SHEETV = { cx: SW / 2, cy: SH / 2, s: Math.min(W / SW, H / SH) * 0.965, rot: 0 };
const ENDV = { cx: TBO.x + 880, cy: TBO.y + 497, s: 1.0, rot: -0.5 * DEG };
const T_OPEN = 1.5, T_PULL = [15.0, 16.7], T_DIVE = [17.1, 18.0], T_STAMP = 18.0;
function camAt(t) {
  if (t < T_OPEN) return openView(t);
  if (t < ST[0].a) return moveView(openView(T_OPEN), stationView(0, ST[0].a), seg(t, T_OPEN, ST[0].a));
  for (let i = 0; i < ST.length; i++) {
    const s = ST[i], n = ST[i + 1];
    if (t < s.l) return stationView(i, t);
    if (n && t < n.a) return moveView(stationView(i, s.l), stationView(i + 1, n.a), seg(t, s.l, n.a));
  }
  if (t < T_PULL[1]) return zoomView(stationView(ST.length - 1, T_PULL[0]), SHEETV, inOutCubic(seg(t, T_PULL[0], T_PULL[1])));
  const hold = { ...SHEETV, s: SHEETV.s * 1.014 };
  if (t < T_DIVE[0]) return { ...SHEETV, s: SHEETV.s * (1 + 0.014 * seg(t, T_PULL[1], T_DIVE[0])) };
  if (t < T_DIVE[1]) return zoomView(hold, ENDV, inOutExpo(seg(t, T_DIVE[0], T_DIVE[1])));
  return { ...ENDV, s: ENDV.s * (1 + 0.03 * inOutCubic(seg(t, T_DIVE[1], DUR))) };
}
function shake(t) {
  let x = 0, y = 0;
  for (const [h, amp] of [[2.0, 5], [T_STAMP, 13]]) if (t >= h) { const k = amp * Math.exp(-(t - h) * 12); x += k * Math.sin((t - h) * 95); y += k * Math.cos((t - h) * 71); }
  return [x, y];
}
function mat(v, t) {
  const cs = Math.cos(v.rot) * v.s, sn = Math.sin(v.rot) * v.s, [sx, sy] = shake(t);
  return { a: cs, b: sn, c: -sn, d: cs, e: W / 2 + sx - (cs * v.cx - sn * v.cy), f: H / 2 + sy - (sn * v.cx + cs * v.cy), s: v.s };
}
const apply = (M, x, y) => [M.a * x + M.c * y + M.e, M.b * x + M.d * y + M.f];
function inv(M, x, y) {
  const det = M.a * M.d - M.b * M.c, X = x - M.e, Y = y - M.f;
  return [(M.d * X - M.c * Y) / det, (-M.b * X + M.a * Y) / det];
}
function viewBox(M) {
  const pts = [[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => inv(M, x, y));
  return { x0: Math.min(...pts.map((p) => p[0])), x1: Math.max(...pts.map((p) => p[0])), y0: Math.min(...pts.map((p) => p[1])), y1: Math.max(...pts.map((p) => p[1])) };
}
const inView = (o, vb, m = 260) => o.x + CW + m > vb.x0 && o.x - m < vb.x1 && o.y + CH + m > vb.y0 && o.y - m < vb.y1;
const setM = (M) => ctx.setTransform(M.a, M.b, M.c, M.d, M.e, M.f);

// ---------- motion blur: more sub-frames the faster the frame moves ----------
const SHUTTER = 0.5 / FPS;   // a 180-degree shutter
function subTimes(t, still) {
  if (still) return [t];
  let t0 = t - SHUTTER / 2, t1 = t + SHUTTER / 2;
  for (const k of CUTS) if (t0 < k && k <= t1) { if (t >= k) t0 = k; else t1 = k - 1e-4; }   // never blur across a cut
  const A = mat(camAt(t0), t0), B = mat(camAt(t1), t1);
  let disp = 0;
  for (const [x, y] of [[0, 0], [W, 0], [0, H], [W, H], [W / 2, H / 2]]) { const p = inv(A, x, y), q = apply(B, p[0], p[1]); disp = Math.max(disp, Math.hypot(q[0] - x, q[1] - y)); }
  let n = clamp(Math.ceil(disp / 3.5), 1, 14);
  if (t > T_STAMP - 0.04 && t < T_STAMP + 0.1) n = Math.max(n, 8);
  return n === 1 ? [t] : Array.from({ length: n }, (_, i) => t0 + (t1 - t0) * (i + 0.5) / n);
}

// ---------- pencil, through the camera ----------
// a pen that takes sheet coordinates: lines are mapped to the screen before the pencil wobble,
// so the strokes keep their weight and character at every zoom
function proxy(pen, M) {
  return {
    ink: "paper",
    line(p, o) { const q = new Array(p.length); for (let i = 0; i < p.length; i += 2) { q[i] = M.a * p[i] + M.c * p[i + 1] + M.e; q[i + 1] = M.b * p[i] + M.d * p[i + 1] + M.f; } pen.line(q, o); },
    rect() {},
  };
}
function flushInk(pen) {
  ictx.setTransform(1, 0, 0, 1, 0, 0); ictx.clearRect(0, 0, W, H);
  pen.flush(ictx);
  ictx.globalCompositeOperation = "destination-out"; ictx.drawImage(Ink.tooth(), 0, 0); ictx.globalCompositeOperation = "source-over";
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "multiply"; ctx.drawImage(ic, 0, 0); ctx.restore();
}
const rectPts = (x, y, w, h) => [x, y, x + w, y, x + w, y + h, x, y + h, x, y];
const circlePts = (cx, cy, r, n = 40) => { const p = []; for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + (i / n) * Math.PI * 2; p.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } return p; };
function ellipsePts(cx, cy, rx, ry, turns = 1.12, n = 64) {
  const p = [];
  for (let i = 0; i <= n; i++) { const a = -2.6 + (i / n) * Math.PI * 2 * turns, k = 1 + 0.05 * (i / n); p.push(cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k + (i / n) * 8); }
  return p;
}

// ---------- type set on the sheet ----------
const MC = mk(8, 8).getContext("2d");
function textW(str, size, w = 800, track = 0) { MC.font = `${w} ${size}px Geist`; MC.letterSpacing = track + "px"; return MC.measureText(str).width; }
function text(str, x, y, size, color, o = {}) {
  ctx.font = `${o.w || 700} ${size}px Geist`; ctx.fillStyle = color; ctx.textAlign = o.align || "left";
  ctx.letterSpacing = (o.track || 0) + "px"; ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1; ctx.letterSpacing = "0px"; ctx.textAlign = "left";
}
const fmtH = (h) => h.toFixed(1) + " h";
const DIM = { y: 136, top: 172, label: 40 };

// ---------- the scene ----------
function grid(M, vb, s) {
  setM(M);
  const lw = 1.1 / s, fade = clamp((60 * s - 6) / 10);
  ctx.fillStyle = RED;
  const x0 = Math.floor(vb.x0 / 60) * 60, y0 = Math.floor(vb.y0 / 60) * 60;
  for (let x = x0; x <= vb.x1; x += 60) { const major = x % 300 === 0; ctx.globalAlpha = major ? 0.22 : 0.11 * fade; if (ctx.globalAlpha > 0.004) ctx.fillRect(x - lw / 2, vb.y0, lw, vb.y1 - vb.y0); }
  for (let y = y0; y <= vb.y1; y += 60) { const major = y % 300 === 0; ctx.globalAlpha = major ? 0.22 : 0.11 * fade; if (ctx.globalAlpha > 0.004) ctx.fillRect(vb.x0, y - lw / 2, vb.x1 - vb.x0, lw); }
  ctx.globalAlpha = 1;
}
function cover(src, x, y, w, h, zoom = 1, px = 0.5, py = 0.35) {
  if (!src) return;
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  const k = Math.max(w / sw, h / sh) * zoom, cw = w / k, ch = h / k;
  ctx.drawImage(src, (sw - cw) * px, (sh - ch) * py, cw, ch, x, y, w, h);
}
const landing = (s) => (s.cutIn ? [s.a, s.a + 0.1] : [s.a - 0.22, s.a]);
function drawPrint(M, s, t) {
  const [L0, L1] = landing(s);
  if (t < L0) return;
  const land = seg(t, L0, L1), lift = 1 - outCubic(land);
  const dev = seg(t, s.a + 0.02, s.a + 0.45 / s.sp);
  const { x, y, w, h } = PR, cx = s.o.x + x + w / 2, cy = s.o.y + y + h / 2, sc = 1 + 0.07 * lift;
  setM(M); ctx.translate(cx, cy); ctx.rotate(s.rot); ctx.scale(sc, sc);
  ctx.globalAlpha = clamp(land * 5);
  ctx.save();
  ctx.shadowColor = `rgba(40,30,20,${0.3 + 0.12 * lift})`; ctx.shadowBlur = (16 + 46 * lift) * M.s; ctx.shadowOffsetY = (7 + 34 * lift) * M.s;
  ctx.fillStyle = CARD; ctx.fillRect(-w / 2 - 14, -h / 2 - 14, w + 28, h + 28);
  ctx.restore();
  const src = s.id in VIDEOS ? vcur[s.id] : img[s.id], kb = 1 + 0.05 * seg(t, s.a, s.l + 0.6);
  cover(src, -w / 2, -h / 2, w, h, kb);
  if (dev < 1) {
    // the print develops from graphite to colour behind a slanted edge
    const X = lerp(-w / 2 - 220, w / 2 + 220, outCubic(dev)), xt = X - 150, xb = X + 150;
    ctx.save(); ctx.beginPath(); ctx.moveTo(xt, -h / 2); ctx.lineTo(w / 2 + 2, -h / 2); ctx.lineTo(w / 2 + 2, h / 2); ctx.lineTo(xb, h / 2); ctx.closePath(); ctx.clip();

    ctx.restore();
