<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Working Drawings · notes</title>
  <link rel="stylesheet" href="css/geist.css">
  <style>
    :root { --paper: #EDE6D5; --card: #f7f3e8; --ink: #16161A; --red: #C8223F; --soft: rgba(22, 22, 26, .55); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: "Geist", system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh;
      background-image: linear-gradient(rgba(200, 34, 63, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(200, 34, 63, .07) 1px, transparent 1px); background-size: 28px 28px; }
    header, footer { display: flex; align-items: baseline; gap: 24px; padding: 18px 32px; }
    header { border-bottom: 1.5px solid var(--ink); }
    footer { border-top: 1.5px solid var(--ink); font-size: 20px; }
    .lbl { font-weight: 700; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--red); }
    .num { font-weight: 900; font-size: 30px; letter-spacing: -.02em; }
    .title { font-weight: 900; font-size: 30px; letter-spacing: -.01em; text-transform: uppercase; flex: 1; }
    .app { font-weight: 700; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; background: var(--red); color: var(--card); padding: 5px 9px; }
    .app:empty { display: none; }
    .timer { font-weight: 900; font-size: 44px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .timer.over { color: var(--red); }
    .plan { font-size: 15px; color: var(--soft); font-variant-numeric: tabular-nums; }
    .clock { font-size: 18px; color: var(--soft); font-variant-numeric: tabular-nums; }
    main { overflow: auto; padding: 28px 32px 36px; }
    #notes { max-width: 980px; font-size: var(--fs, 30px); line-height: 1.35; }
    #notes p { margin: 0 0 .6em; }
    #notes ul { margin: 0 0 .6em; padding-left: 1.1em; }
    #notes li { margin: 0 0 .35em; }
    #notes li::marker { color: var(--red); }
    #notes blockquote { margin: .2em 0 .7em; padding: .35em .7em; background: var(--card); border-left: 5px solid var(--red); font-weight: 700; box-shadow: 0 6px 14px -8px rgba(40, 30, 20, .3); }
    #notes .act { display: inline-block; font-size: .62em; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--card); background: var(--ink); padding: .25em .55em; vertical-align: .18em; margin-right: .3em; }
    #notes .none { color: var(--soft); font-size: 22px; }
    .next { flex: 1; } .next b { font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
    .help { font-size: 14px; color: var(--soft); }
    .wait { color: var(--soft); }
  </style>
</head>
<body>
  <header>
    <span class="num" id="num">–</span>
    <span class="title" id="title"><span class="wait">Waiting for the deck… (open it, then press P there)</span></span>
    <span class="app" id="app"></span>
    <span class="plan" id="plan"></span>
    <span class="timer" id="timer">0:00</span>
    <span class="clock" id="clock"></span>
  </header>
  <main><div id="notes"></div></main>
  <footer>
    <span class="lbl">Next</span><span class="next" id="next"></span>
    <span class="help">→ ← move both windows · T restart timer · + − text size</span>
  </footer>
<script>
(function () {
  "use strict";
  // notes.md: one "## <sheet number> · <name> · <seconds> s" section per sheet. Cues as "- " bullets,
  // "> " for lines to say exactly, [square brackets] for actions. Reread on every sheet change.
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s)
    .replace(/\[([^\]]+)\]/g, '<span class="act">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>");
  function render(md) {
    const out = []; let list = false;
    for (const raw of md.split("\n")) {
      const line = raw.trimEnd();
      const li = /^\s*[-*] (.*)/.exec(line), q = /^> ?(.*)/.exec(line);
      if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
      if (list) { out.push("</ul>"); list = false; }
      if (q) out.push(`<blockquote>${inline(q[1])}</blockquote>`);
      else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
    if (list) out.push("</ul>");
    return out.join("");
  }
  function parse(text) {
    const secs = {}; let curN = null, buf = [], budget = {};
    const flush = () => { if (curN !== null) secs[curN] = buf.join("\n"); };
    for (const line of text.split("\n")) {
      const m = /^##\s+(\d+)\b(.*)$/.exec(line);
      if (m) { flush(); curN = +m[1]; buf = []; const t = /(\d+)\s*s\b/.exec(m[2]); if (t) budget[curN] = +t[1]; continue; }
      if (/^#\s/.test(line)) { flush(); curN = null; continue; }
      if (curN !== null) buf.push(line);
    }
    flush();
    return { secs, budget };
  }

  let notes = { secs: {}, budget: {} }, state = null, t0 = null, fs = 30;
  try { fs = +localStorage.getItem("wd-notes-fs") || 30; } catch (e) { /* */ }
  document.documentElement.style.setProperty("--fs", fs + "px");

  async function load() {
    try {
      const r = await fetch("notes.md?" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      notes = parse(await r.text());
    } catch (e) { notes = { secs: {}, budget: {}, missing: true }; }
  }
  function paint() {
    if (!state) return;
    $("num").textContent = state.n ? `${state.n} / ${state.main}` : "Appendix";
    $("title").textContent = state.title;
    $("app").textContent = state.app ? { clip: "walk on the page", live: "app on the page", recording: "recording on the page", full: "app full screen" }[state.app] || state.app : "";
    $("next").innerHTML = state.next ? `<b>${esc(state.next)}</b>` : "—";
    const body = state.n && notes.secs[state.n];
    $("notes").innerHTML = notes.missing ? '<p class="none">No notes.md found next to the deck (it is only on the presenter\'s laptop; serve the deck with ./serve.sh).</p>'
      : body && body.trim() ? render(body) : '<p class="none">No notes for this sheet.</p>';
    let plan = 0; for (let i = 1; i <= (state.n || 0); i++) plan += notes.budget[i] || 0;
    $("plan").textContent = plan ? `plan ${mmss(plan)}` : "";
  }
  const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  function tick() {
    const el = t0 ? (Date.now() - t0) / 1000 : 0;
    $("timer").textContent = mmss(el);
    let total = 0; for (const k in notes.budget) total += notes.budget[k];
    $("timer").classList.toggle("over", total > 0 && el > total);
    $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  setInterval(tick, 500); tick();

  const chan = new BroadcastChannel("working-drawings");
  chan.onmessage = async ({ data }) => {
    if (!data.state) return;
    const prev = state; state = data.state;
    if (!t0 && prev && prev.cur === 0 && state.cur > 0) t0 = Date.now();   // the timer starts when the cover is left
    if (!prev || prev.cur !== state.cur) await load();
    paint();
  };
  load().then(() => chan.postMessage({ hello: true }));

  const FWD = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown", "PageUp", "PageDown", " ", "Enter", "Escape", "Home", "End", "Backspace", "a", "i", "l"];
  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === "t") { t0 = Date.now(); return; }
    if (k === "+" || k === "=" || k === "-") {
      fs = Math.max(18, Math.min(56, fs + (k === "-" ? -2 : 2)));
      document.documentElement.style.setProperty("--fs", fs + "px");
      try { localStorage.setItem("wd-notes-fs", fs); } catch (_) { /* */ }
      return;
    }
    if (FWD.includes(k)) { e.preventDefault(); chan.postMessage({ key: k, shift: e.shiftKey }); }
  });
})();
</script>
</body>
</html>
